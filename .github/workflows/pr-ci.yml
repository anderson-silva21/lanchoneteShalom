name: PR CI

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  CI: true

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend linter
        run: npm run lint
        working-directory: frontend

      # Backend ainda nao possui script de lint. Quando adicionar ESLint/Prettier no backend,
      # inclua um script "lint" em backend/package.json e habilite o passo abaixo.
      # - name: Run backend linter
      #   run: npm run lint
      #   working-directory: backend

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A aplicacao usa SQLite em arquivo via DB_PATH, entao nao precisa de services hoje.
    # Exemplo para futuras dependencias:
    #
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_DB: lanchonete_test
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U postgres -d lanchonete_test"
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-more-than-32-characters
      BACKUP_BEFORE_MIGRATIONS: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: |
          mkdir -p test-results coverage
          node --test --test-reporter=spec test/*.test.js | tee test-results/backend-tests.txt
        working-directory: backend

      - name: Generate backend coverage report
        if: always()
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage test/*.test.js > coverage/backend-coverage.txt
        working-directory: backend

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/test-results/
            backend/coverage/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit backend production dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: backend

      - name: Audit frontend production dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: frontend

      - name: Get Trivy cache date
        id: trivy-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.trivy-date.outputs.date }}
          restore-keys: cache-trivy-

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.1  # Use latest stable release instead of pinned commit
        with:
          version: v0.68.2
          cache: true

      - name: Verify Trivy installation
        run: trivy --version

      - name: Scan filesystem vulnerabilities with Trivy
        run: |
          trivy fs \
            --cache-dir "${{ github.workspace }}/.cache/trivy" \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            --exit-code 1 \
            .

      - name: Upload Trivy SARIF to code scanning
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Scan for leaked secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Se o projeto ganhar Dockerfile, habilite este bloco para validar o empacotamento da imagem.
      # - name: Build Docker image
      #   run: docker build --pull --tag lanchonete-shalom:${{ github.sha }} .

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7